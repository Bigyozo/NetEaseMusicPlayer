<div class="search-panel">
  <div class="list-wrap">
    <div class="list-item clearfix" [hidden]="!searchResult?.songs">
      <div class="hd">
        <i class="ico ico-song"></i>
        <span>
          <!-- 楽曲 -->
          {{ lanRes.C00074 }}
        </span>
      </div>
      <ul>
        @for (item of searchResult?.songs; track item.id) {
          <li
            class="ellipsis"
            (mousedown)="toInfo(['/songInfo', item.id])"
            [innerHTML]="item.name"
          ></li>
        }
      </ul>
    </div>

    <div class="list-item clearfix" [hidden]="!searchResult?.artists">
      <div class="hd">
        <i class="ico ico-singer"></i>
        <span>
          <!-- アーティスト -->
          {{ lanRes.C00012 }}
        </span>
      </div>
      <ul>
        @for (item of searchResult?.artists; track item.id) {
          <li
            class="ellipsis"
            (mousedown)="toInfo(['/singer', item.id])"
            [innerHTML]="item.name"
          ></li>
        }
      </ul>
    </div>

    <div class="list-item clearfix" [hidden]="!searchResult?.playlists">
      <div class="hd">
        <i class="ico ico-sheet"></i>
        <span>
          <!-- プレイリスト -->
          {{ lanRes.C00003 }}
        </span>
      </div>
      <ul>
        @for (item of searchResult?.playlists; track item.id) {
          <li
            class="ellipsis"
            (mousedown)="toInfo(['/sheetInfo', item.id])"
            [innerHTML]="item.name"
          ></li>
        }
      </ul>
    </div>
  </div>
</div>
